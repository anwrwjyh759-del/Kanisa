<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELOAD</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #05060c;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,0,60,0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,140,255,0.18), transparent 40%);
    font-family: 'Cairo', sans-serif;
    color: #e8f4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(8, 10, 20, 0.85);
    border: 2px solid #ff1744;
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow:
      0 0 12px #ff1744,
      0 0 30px rgba(255,23,68,0.4),
      inset 0 0 20px rgba(0,153,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 2px;
    background: linear-gradient(135deg, #ff1744, #00b0ff, #ff1744);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.6;
  }
  h1.logo {
    text-align: center;
    font-size: 2.6em;
    font-weight: 900;
    letter-spacing: 4px;
    margin: 0 0 4px;
    color: #fff;
    text-shadow:
      0 0 6px #00b0ff,
      0 0 16px #00b0ff,
      0 0 26px #ff1744,
      0 0 40px #ff1744;
  }
  .subtitle {
    text-align: center;
    color: #7fd8ff;
    font-size: 0.85em;
    margin-bottom: 22px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #00b0ff;
  }
  .neon-blue { color: #4fd1ff; text-shadow: 0 0 6px #00b0ff, 0 0 12px #00b0ff; }
  .neon-red { color: #ff5c7a; text-shadow: 0 0 6px #ff1744, 0 0 12px #ff1744; }

  input[type=text], input[type=password] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 2px solid #00b0ff;
    background: #0a0d18;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 1em;
    outline: none;
    text-align: center;
    box-shadow: 0 0 8px rgba(0,176,255,0.5);
    margin-bottom: 14px;
  }
  input:focus { border-color: #ff1744; box-shadow: 0 0 12px rgba(255,23,68,0.7); }

  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 1.05em;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #ff1744, #b0003a);
    box-shadow: 0 0 14px rgba(255,23,68,0.7);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(255,23,68,0.9); }
  button:active { transform: translateY(0); }
  button.blue {
    background: linear-gradient(135deg, #00b0ff, #005a8c);
    box-shadow: 0 0 14px rgba(0,176,255,0.7);
  }
  button.blue:hover { box-shadow: 0 0 20px rgba(0,176,255,0.9); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .progress-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 0.85em;
    color: #9fd8ff;
  }
  .bar-bg {
    background: #0a0d18;
    border: 1px solid #00b0ff;
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff1744, #00b0ff);
    box-shadow: 0 0 8px #ff1744;
    transition: width 0.3s ease;
  }

  .question-box {
    background: rgba(0,176,255,0.06);
    border: 1px solid rgba(0,176,255,0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    font-size: 1.05em;
    line-height: 1.6;
    text-align: center;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: right;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 2px solid rgba(255,23,68,0.5);
    background: rgba(10,13,24,0.8);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.98em;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .choice:hover { border-color: #ff1744; box-shadow: 0 0 10px rgba(255,23,68,0.6); }
  .choice.correct { border-color: #00e676; background: rgba(0,230,118,0.15); box-shadow: 0 0 14px rgba(0,230,118,0.6); }
  .choice.wrong { border-color: #ff1744; background: rgba(255,23,68,0.2); box-shadow: 0 0 14px rgba(255,23,68,0.6); }
  .choice.disabled { pointer-events: none; opacity: 0.85; }

  .center-text { text-align: center; margin: 10px 0; color: #cfe9ff; line-height: 1.7; }
  .score-big {
    text-align: center;
    font-size: 2.2em;
    font-weight: 900;
    margin: 10px 0 4px;
    color: #fff;
    text-shadow: 0 0 10px #ff1744, 0 0 20px #00b0ff;
  }
  .hint { text-align: center; font-size: 0.8em; color: #6f8db3; margin-top: 8px; }
  .error-msg { color: #ff5c7a; text-align: center; font-size: 0.9em; margin: -6px 0 14px; min-height: 1em; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid #00b0ff;
    color: #4fd1ff;
    font-size: 0.75em;
    text-shadow: 0 0 6px #00b0ff;
  }
  .top-row { display:flex; justify-content: space-between; align-items:center; margin-bottom: 16px; }
  .name-tag { font-size: 0.85em; color: #7fd8ff; }
  .loading { text-align:center; color:#7fd8ff; padding: 30px 0; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="loading" id="loadingScreen">جارِ التحميل...</div>
</div>

<script>
const STORAGE_KEY = 'reload_progress';
const PASSWORD = '250746';

// ---------- 40 Questions ----------
const QUESTIONS_PART1 = [
  {q:"ما هو العنصر الكيميائي الأكثر وفرة في القشرة الأرضية؟", c:["السيليكون","الأكسجين","الألمنيوم","الحديد"], a:1},
  {q:"من صاحب نظرية التطور عن طريق الانتقاء الطبيعي؟", c:["غريغور مندل","تشارلز داروين","لويس باستور","ألفريد والاس"], a:1},
  {q:"ما هي عاصمة كازاخستان؟", c:["ألماتي","أستانا","بيشكيك","تاشكند"], a:1},
  {q:"من قائل عبارة 'أنا أفكر إذن أنا موجود'؟", c:["إيمانويل كانط","روني ديكارت","باروخ سبينوزا","جورج هيغل"], a:1},
  {q:"ما هي وحدة قياس شدة التيار الكهربائي؟", c:["الفولت","الأمبير","الأوم","الواط"], a:1},
  {q:"في أي عام وقعت معركة عين جالوت بين المماليك والمغول؟", c:["1187","1250","1260","1291"], a:2},
  {q:"من هو مكتشف قانون الجاذبية العامة؟", c:["غاليليو غاليلي","إسحاق نيوتن","يوهانس كبلر","ألبرت أينشتاين"], a:1},
  {q:"ما هو أطول نهر في قارة أفريقيا؟", c:["نهر الكونغو","نهر النيل","نهر النيجر","نهر الزمبيزي"], a:1},
  {q:"من هو مؤلف كتاب 'رأس المال'؟", c:["آدم سميث","كارل ماركس","ماكس فيبر","جون كينز"], a:1},
  {q:"من هو أول خليفة أموي؟", c:["يزيد بن معاوية","معاوية بن أبي سفيان","عبد الملك بن مروان","الوليد بن عبد الملك"], a:1},
  {q:"ما هي أصغر وحدة بناء وظيفية في الكائن الحي؟", c:["الأنسجة","الخلية","الذرة","الجزيء"], a:1},
  {q:"من هو مؤلف رواية 'الجريمة والعقاب'؟", c:["ليو تولستوي","فيودور دوستويفسكي","إيفان تورجينيف","نيقولاي غوغول"], a:1},
  {q:"ما هي عاصمة الأوروغواي؟", c:["بوينس آيرس","مونتفيديو","أسونسيون","سانتياغو"], a:1},
  {q:"في أي سنة اندلعت الثورة الفرنسية؟", c:["1776","1789","1804","1815"], a:1},
  {q:"ما اسم الخط الوهمي الذي يقسم الأرض إلى نصف شمالي ونصف جنوبي؟", c:["خط غرينتش","خط الاستواء","مدار السرطان","مدار الجدي"], a:1},
  {q:"من يُعتبر مؤسس علم الاجتماع الحديث في الفكر الغربي؟", c:["كارل ماركس","أوجست كونت","ماكس فيبر","إميل دوركايم"], a:1},
  {q:"ما هو أكبر عضو في جسم الإنسان من حيث المساحة؟", c:["الكبد","الجلد","الأمعاء الدقيقة","الرئتان"], a:1},
  {q:"من هو القائد القرطاجي الذي عبر جبال الألب بالفيلة لمحاربة روما؟", c:["هاميلكار برقا","حنبعل","سكيبيو الأفريقي","يوغرطة"], a:1},
  {q:"ما اسم المعاهدة التي أنهت رسمياً الحرب العالمية الأولى؟", c:["معاهدة يالطا","معاهدة فرساي","معاهدة وستفاليا","معاهدة باريس"], a:1},
  {q:"ما هي وحدة قياس الضغط في النظام الدولي؟", c:["النيوتن","الباسكال","الجول","الواط"], a:1}
];

const QUESTIONS_PART2 = [
  {q:"من هو مكتشف مادة البنسلين؟", c:["لويس باستور","ألكسندر فليمنغ","روبرت كوخ","إدوارد جينر"], a:1},
  {q:"ما اسم أطول جدار دفاعي بناه الإنسان عبر التاريخ؟", c:["جدار برلين","سور الصين العظيم","أسوار القسطنطينية","جدار هادريان"], a:1},
  {q:"من هو مؤلف ملحمة 'الإلياذة'؟", c:["سوفوكليس","هوميروس","يوربيديس","أرسطوفانيس"], a:1},
  {q:"ما اسم الحرب التي دارت بين أثينا وإسبرطة في اليونان القديمة؟", c:["الحروب الفارسية","الحرب البيلوبونيسية","حرب طروادة","حروب الإسكندر"], a:1},
  {q:"ما هي وحدة قياس القوة في النظام الدولي؟", c:["الجول","نيوتن","الواط","الباسكال"], a:1},
  {q:"من هو أول خليفة راشد بعد وفاة النبي محمد؟", c:["عمر بن الخطاب","أبو بكر الصديق","عثمان بن عفان","علي بن أبي طالب"], a:1},
  {q:"ما اسم أكبر شعاب مرجانية في العالم؟", c:["شعاب البحر الأحمر","الحاجز المرجاني العظيم","شعاب المحيط الهندي","شعاب الكاريبي"], a:1},
  {q:"من هو العالم الذي وضع فكرة الكم (الكوانتا) لأول مرة؟", c:["نيلز بور","ماكس بلانك","فيرنر هايزنبرغ","إروين شرودنغر"], a:1},
  {q:"ما اسم أقدم جامعة لا تزال قائمة حتى اليوم بحسب موسوعة غينيس؟", c:["جامعة الأزهر","جامعة القرويين","جامعة بولونيا","جامعة أكسفورد"], a:1},
  {q:"في أي معركة هُزم نابليون بونابرت هزيمته الأخيرة؟", c:["معركة أوسترليتز","معركة واترلو","معركة ترافالغار","معركة بورودينو"], a:1},
  {q:"ما اسم النظرية التي تصف انحناء الزمكان بسبب الكتلة؟", c:["النسبية الخاصة","النسبية العامة","ميكانيكا الكم","نظرية الأوتار"], a:1},
  {q:"من هو مخترع الطباعة بالحروف المتحركة في أوروبا؟", c:["ويليام كاكستون","يوهان غوتنبرغ","ألدوس مانوتيوس","جون باسكرفيل"], a:1},
  {q:"ما اسم أكبر صحراء باردة في العالم؟", c:["صحراء غوبي","القارة القطبية الجنوبية","سيبيريا","غرينلاند"], a:1},
  {q:"من هو مؤلف كتاب 'الأمير' في الفكر السياسي؟", c:["توماس هوبز","نيكولو مكيافيلي","جان جاك روسو","جون لوك"], a:1},
  {q:"ما اسم الإمبراطورية التي أسسها جنكيز خان؟", c:["الإمبراطورية العثمانية","الإمبراطورية المغولية","إمبراطورية تيمورلنك","الخلافة العباسية"], a:1},
  {q:"ما هي وحدة قياس الطاقة في النظام الدولي؟", c:["النيوتن","الجول","الواط","الباسكال"], a:1},
  {q:"من هو مؤلف كتاب 'أصل الأنواع'؟", c:["غريغور مندل","تشارلز داروين","ألفريد والاس","توماس هكسلي"], a:1},
  {q:"ما اسم البركان الذي دمر مدينة بومبي الرومانية عام 79 ميلادياً؟", c:["إتنا","فيزوف","كراكاتوا","سانت هيلين"], a:1},
  {q:"من هو الفيلسوف اليوناني الذي كتب محاورة 'الجمهورية'؟", c:["أرسطو","أفلاطون","سقراط","ديموقريطس"], a:1},
  {q:"ما اسم المعركة التي استعاد فيها صلاح الدين الأيوبي بيت المقدس من الصليبيين؟", c:["معركة حطين","معركة عين جالوت","معركة اليرموك","معركة القادسية"], a:0}
];

function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getShuffledChoices(item){
  const order = shuffleArray(item.c.map((_, idx) => idx));
  const choices = order.map(idx => item.c[idx]);
  const correctIndex = order.indexOf(item.a);
  return { choices, correctIndex };
}

const app = document.getElementById('app');
let state = null;

function defaultState(){
  return { name:'', phase:'register', idx:0, score:0, phase2started:false };
}

async function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch(e){
    state = defaultState();
  }
  render();
}

async function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){
    console.error('فشل الحفظ', e);
  }
}

function render(){
  if (state.phase === 'register') return renderRegister();
  if (state.phase === 'quiz1') return renderQuiz(QUESTIONS_PART1, 'quiz1');
  if (state.phase === 'password') return renderPassword();
  if (state.phase === 'quiz2') return renderQuiz(QUESTIONS_PART2, 'quiz2');
  if (state.phase === 'finished') return renderFinished();
}

function renderRegister(){
  app.innerHTML = `
    <h1 class="logo"><span class="neon-red">RE</span><span class="neon-blue">LOAD</span></h1>
    <div class="subtitle">مسابقة المعلومات العامة</div>
    <div class="center-text">اكتب اسمك للبدء</div>
    <input type="text" id="nameInput" placeholder="اسمك هنا">
    <div class="error-msg" id="regError"></div>
    <button id="startBtn">ابدأ المسابقة</button>
  `;
  document.getElementById('startBtn').onclick = () => {
    const val = document.getElementById('nameInput').value.trim();
    if (!val) {
      document.getElementById('regError').textContent = 'من فضلك اكتب اسمك أولاً';
      return;
    }
    state.name = val;
    state.phase = 'quiz1';
    state.idx = 0;
    state.score = 0;
    saveState();
    render();
  };
}

function renderQuiz(bank, phaseKey){
  const total = bank.length;
  const i = state.idx;
  if (i >= total) {
    if (phaseKey === 'quiz1') {
      state.phase = 'password';
      state.score1 = state.score;
    } else {
      state.phase = 'finished';
    }
    saveState();
    render();
    return;
  }
  const item = bank[i];
  const { choices: shuffledChoices, correctIndex } = getShuffledChoices(item);
  const pct = Math.round((i/total)*100);
  const roundLabel = phaseKey === 'quiz1' ? 'الجولة الأولى' : 'الجولة الثانية';

  app.innerHTML = `
    <div class="top-row">
      <span class="name-tag">👤 ${escapeHtml(state.name)}</span>
      <span class="badge">${roundLabel}</span>
    </div>
    <h1 class="logo" style="font-size:1.6em;">RELOAD</h1>
    <div class="progress-wrap">
      <span>السؤال ${i+1} من ${total}</span>
      <span>النقاط: ${state.score}</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="question-box">${escapeHtml(item.q)}</div>
    <div id="choices"></div>
  `;

  const choicesDiv = document.getElementById('choices');
  shuffledChoices.forEach((choiceText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.onclick = () => handleAnswer(idx, correctIndex, bank, phaseKey);
    choicesDiv.appendChild(btn);
  });
}

function handleAnswer(chosenIdx, correctIndex, bank, phaseKey){
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => b.classList.add('disabled'));
  buttons[correctIndex].classList.add('correct');
  if (chosenIdx !== correctIndex) {
    buttons[chosenIdx].classList.add('wrong');
  } else {
    state.score += 1;
  }
  setTimeout(() => {
    state.idx += 1;
    saveState();
    render();
  }, 900);
}

function renderPassword(){
  app.innerHTML = `
    <h1 class="logo" style="font-size:1.8em;">RELOAD</h1>
    <div class="center-text">
      أحسنت يا ${escapeHtml(state.name)} 🎉<br>
      أنهيت الجولة الأولى بـ <span class="neon-blue">${state.score}</span> من 20 نقطة.
    </div>
    <div class="center-text">لفتح الجولة الثانية، اكتب كلمة السر:</div>
    <input type="password" id="passInput" placeholder="كلمة السر">
    <div class="error-msg" id="passError"></div>
    <button id="unlockBtn" class="blue">فتح الجولة الثانية</button>
  `;
  document.getElementById('unlockBtn').onclick = () => {
    const val = document.getElementById('passInput').value.trim();
    if (val === PASSWORD) {
      state.phase = 'quiz2';
      state.idx = 0;
      saveState();
      render();
    } else {
      document.getElementById('passError').textContent = 'كلمة السر غير صحيحة، حاول مرة أخرى';
    }
  };
}

function renderFinished(){
  const score1 = state.score1 || 0;
  const score2 = state.score - score1;
  const total = state.score;
  app.innerHTML = `
    <h1 class="logo" style="font-size:1.8em;">RELOAD</h1>
    <div class="center-text">أنهى المسابقة: <b>${escapeHtml(state.name)}</b></div>
    <div class="score-big">${total} / 40</div>
    <div class="center-text">
      الجولة الأولى: <span class="neon-red">${score1}</span> / 20 &nbsp;|&nbsp;
      الجولة الثانية: <span class="neon-blue">${score2}</span> / 20
    </div>
    <div class="center-text">شكراً لمشاركتك في RELOAD! 🎉</div>
    <div class="hint">إذا خرجت ودخلت مرة أخرى سيُطلب منك كلمة السر مجدداً.</div>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadState();
</script>
</body>
</html>
